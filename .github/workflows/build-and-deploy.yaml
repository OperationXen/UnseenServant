name: SSH deployment

on:
  push:
    branches: ["main"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install uv && uv sync --no-dev
      - name: Run tests
        run: uv run coverage run -m pytest
      - name: "Upload coverage to Codecov"
        uses: codecov/codecov-action@v1

  build-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - parallel:
        - name: Build - API
          uses: docker/build-push-action@v7
          with:
            file: ./build/api/Dockerfile
            push: true
            tags: operationxen/unseen_servant_api:main

        - name: Build - Discord Bot
          uses: docker/build-push-action@v7
          with:
            file: ./build/bot/Dockerfile
            push: true
            tags: operationxen/unseen_servant_bot:main

  deploy-API:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-containers, unit-tests]

    steps:
      - name: Deploy API
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker pull operationxen/unseen_servant_api:main
            docker stop unseen_servant_api || true
            docker rm unseen_servant_api || true
            docker run -d --name unseen_servant_api --network=unseen_servant_net -p 127.0.0.1:8000:80 \
              -e DJANGO_SECRET=${{ secrets.DJANGO_SECRET }} -e DB_HOST=${{ secrets.DB_HOST }} \
              -e DB_USER=${{ secrets.DB_USER }} -e DB_PASS=${{ secrets.DB_PASS }} \
              -e DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }} -e DISCORD_GUILDS=${{ secrets.DISCORD_GUILDS }} \
              -e DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }} -e DISCORD_CLIENT_SECRET=${{ secrets.DISCORD_CLIENT_SECRET }} \
              -e MOONSEACODEX_URL=${{ vars.MOONSEACODEX_URL }} -e MOONSEACODEX_APIKEY=${{ secrets.MOONSEACODEX_APIKEY }} \
              -e WEBAPP_URL=${{ secrets.WEBAPP_URL }} \
              -e CHANNEL_SEND_PINGS=${{ secrets.CHANNEL_SEND_PINGS }} -e OAUTH_COMPLETE_URL=${{ secrets.OAUTH_COMPLETE_URL }} \
              -e OAUTH_REDIRECT_URL=${{ secrets.OAUTH_REDIRECT_URL }} -e OAUTH_FAIL_URL=${{ secrets.OAUTH_FAIL_URL }} \
              -e DB_HOST=${{ secrets.DB_HOST }} -e DB_NAME=${{ secrets.DB_NAME }} \
              -e DB_USER=${{ secrets.DB_USER }} -e DB_PASS=${{ secrets.DB_PASS }} \
              -v /var/opt/unseen_servant:/unseen_servant/database \
              --restart always \
              operationxen/unseen_servant_api:main

      - name: Database migrations
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker exec unseen_servant_api uv run manage.py migrate

  deploy-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-containers, unit-tests]

    steps:
      - name: Deploy discord bot
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker pull operationxen/unseen_servant_bot:main
            docker stop unseen_servant_bot || true
            docker rm unseen_servant_bot || true
            docker run -d --name unseen_servant_bot --network=unseen_servant_net \
              -e DJANGO_SECRET=${{ secrets.DJANGO_SECRET }} -e DB_HOST=${{ secrets.DB_HOST }} \
              -e DB_USER=${{ secrets.DB_USER }} -e DB_PASS=${{ secrets.DB_PASS }} \
              -e DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }} -e DISCORD_GUILDS=${{ secrets.DISCORD_GUILDS }} \
              -e DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }} -e DISCORD_CLIENT_SECRET=${{ secrets.DISCORD_CLIENT_SECRET }} \
              -e MOONSEACODEX_URL=${{ vars.MOONSEACODEX_URL }} -e MOONSEACODEX_APIKEY=${{ secrets.MOONSEACODEX_APIKEY }} \
              -e WEBAPP_URL=${{ secrets.WEBAPP_URL }} \
              -e CHANNEL_SEND_PINGS=${{ secrets.CHANNEL_SEND_PINGS }} -e OAUTH_COMPLETE_URL=${{ secrets.OAUTH_COMPLETE_URL }} \
              -e OAUTH_REDIRECT_URL=${{ secrets.OAUTH_REDIRECT_URL }} -e OAUTH_FAIL_URL=${{ secrets.OAUTH_FAIL_URL }} \
              -e DB_HOST=${{ secrets.DB_HOST }} -e DB_NAME=${{ secrets.DB_NAME }} \
              -e DB_USER=${{ secrets.DB_USER }} -e DB_PASS=${{ secrets.DB_PASS }} \
              -v /var/opt/unseen_servant:/unseen_servant/database \
              --restart always \
              operationxen/unseen_servant_bot:main
